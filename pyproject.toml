[project]
name = "leaply-guard"
version = "0.1.0"
description = "Upgrade a vulnerable dependency across a breaking major version and prove it with your tests. NVIDIA Nemotron 3 on Nebius Token Factory."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-dotenv>=1.0",
  "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
leaply-guard = "leaply_guard.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["leaply_guard*"]

[tool.setuptools.package-data]
leaply_guard = ["proofs/*.py", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end runs that create virtualenvs"]
